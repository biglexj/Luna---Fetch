<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Luna Fetch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <h1>Luna Fetch</h1>
      </div>
      <p class="subtitle">Envía un enlace a tu escritorio</p>
    </header>

    <label class="lbl" for="url">Enlace</label>
    <input id="url" type="text" placeholder="https://…" autocomplete="off" spellcheck="false">

    <div class="format-row">
      <button class="fmt-btn selected" data-fmt="mp4">🎬 Video MP4</button>
      <button class="fmt-btn"          data-fmt="mp3">🎵 Audio MP3</button>
    </div>

    <button id="send" class="send-btn">Enviar a Luna Fetch</button>
    <div id="status" class="status"></div>

    <div class="hint">
      💡 Se descarga en la mejor calidad disponible.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
