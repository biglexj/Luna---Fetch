# Configuración de tareas de Luna Fetch mediante Mise
# Reutiliza el estándar común: dev, build, release, publish

[tasks.dev]
raw_args = true
description = "Ejecutar Luna Fetch en desarrollo (Desktop por defecto, o 'android' para instalar en móvil)"
file = "scripts/mise-task.ts"

[tasks.build]
raw_args = true
description = "Compilar ejecutable Desktop o APK de Android ('mise build' o 'mise build android')"
file = "scripts/mise-task.ts"

[tasks.release]
raw_args = true
description = "Generar distribuibles locales (Inno Setup .exe, APK y SHA256SUMS.txt) sin publicar"
file = "scripts/mise-task.ts"

[tasks.publish]
raw_args = true
description = "Publicar release en GitHub y sincronizar ficha en Aurora (--plan y --check sin escritura)"
file = "scripts/mise-task.ts"
